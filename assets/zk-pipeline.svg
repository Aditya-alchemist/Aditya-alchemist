<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.5" stop-color="#302b63"/>
      <stop offset="1" stop-color="#0b2a3a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#24c6dc"/>
      <stop offset="1" stop-color="#b57bff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="260" rx="22" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="897" height="257" rx="21" fill="none" stroke="#24c6dc" stroke-opacity="0.35" stroke-width="1.5"/>

  <text x="450" y="42" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700" letter-spacing="5">ZERO KNOWLEDGE PIPELINE</text>
  <text x="450" y="64" text-anchor="middle" fill="#24c6dc" font-size="12" opacity="0.85">prove everything · reveal nothing</text>

  <!-- connector -->
  <path id="track" d="M130,130 H770" stroke="url(#line)" stroke-width="3" stroke-dasharray="8 8" fill="none" opacity="0.8">
    <animate attributeName="stroke-dashoffset" from="64" to="0" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- travelling packet -->
  <circle r="7" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="4s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
      <mpath href="#track"/>
    </animateMotion>
  </circle>

  <!-- nodes -->
  <g>
    <circle cx="130" cy="130" r="36" fill="#0f0c29" stroke="#24c6dc" stroke-width="3" filter="url(#glow)">
      <animate attributeName="r" values="36;40;36" dur="4s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <text x="130" y="138" text-anchor="middle" fill="#24c6dc" font-size="22" font-weight="700">{ }</text>
    <text x="130" y="192" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Circuit</text>
    <text x="130" y="212" text-anchor="middle" fill="#9fb3c8" font-size="11">Circom · Halo2</text>
  </g>
  <g>
    <circle cx="343" cy="130" r="36" fill="#0f0c29" stroke="#6ea8ff" stroke-width="3" filter="url(#glow)">
      <animate attributeName="r" values="36;40;36" dur="4s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <text x="343" y="138" text-anchor="middle" fill="#6ea8ff" font-size="22" font-weight="700">w</text>
    <text x="343" y="192" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Witness</text>
    <text x="343" y="212" text-anchor="middle" fill="#9fb3c8" font-size="11">private inputs</text>
  </g>
  <g>
    <circle cx="557" cy="130" r="36" fill="#0f0c29" stroke="#b57bff" stroke-width="3" filter="url(#glow)">
      <animate attributeName="r" values="36;40;36" dur="4s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <text x="557" y="139" text-anchor="middle" fill="#b57bff" font-size="24" font-weight="700">π</text>
    <text x="557" y="192" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Proof</text>
    <text x="557" y="212" text-anchor="middle" fill="#9fb3c8" font-size="11">SNARK · STARK</text>
  </g>
  <g>
    <circle cx="770" cy="130" r="36" fill="#0f0c29" stroke="#3ddc97" stroke-width="3" filter="url(#glow)">
      <animate attributeName="r" values="36;40;36" dur="4s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <text x="770" y="139" text-anchor="middle" fill="#3ddc97" font-size="24" font-weight="700">✓</text>
    <text x="770" y="192" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Verify</text>
    <text x="770" y="212" text-anchor="middle" fill="#9fb3c8" font-size="11">Solidity · on-chain</text>
  </g>
</svg>
