<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 10" width="900" height="10" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#24c6dc" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#24c6dc"/>
      <stop offset="1" stop-color="#b57bff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="4" width="900" height="2" rx="1" fill="url(#g)" opacity="0.5"/>
  <circle cy="5" r="4" fill="#ffffff">
    <animate attributeName="cx" values="0;900" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="3.5s" repeatCount="indefinite"/>
  </circle>
</svg>
